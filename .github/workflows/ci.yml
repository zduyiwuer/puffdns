name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the project has zero runtime dependencies.
      - name: Unit and API tests
        run: node test/smoke.js

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sends real DNS packets over UDP/TCP against a spawned server and
      # verifies state survives a restart.
      - name: End-to-end tests
        run: node test/live.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: puffdns:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name puffdns-ci \
            -e DNS_PORT=5353 \
            -e WEB_PORT=8080 \
            -e ADMIN_PASSWORD=citest123 \
            -p 18080:8080 \
            puffdns:ci
          # Wait for the panel to report healthy
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              echo "server is up"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          # Confirm the image reports healthy on its own
          docker inspect --format '{{.State.Health.Status}}' puffdns-ci
          docker rm -f puffdns-ci
