<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>puffdns · DNS 面板</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🫧</text></svg>">
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────── -->
<div id="login" class="login-screen" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-logo">🫧</div>
    <h1>puffdns</h1>
    <p class="login-sub">权威 DNS 与递归转发管理面板</p>
    <label class="field">
      <span>用户名</span>
      <input type="text" id="login-user" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>密码</span>
      <input type="password" id="login-pass" autocomplete="current-password" required>
    </label>
    <div class="login-error" id="login-error" hidden></div>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">登录</button>
  </form>
</div>

<!-- ── App ───────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">🫧</span><span>puffdns</span></div>
    <nav id="nav">
      <button class="nav-item" data-view="dashboard"><span class="ico">◈</span>概览</button>
      <button class="nav-item" data-view="zones"><span class="ico">▤</span>域名</button>
      <button class="nav-item" data-view="records"><span class="ico">≡</span>解析记录</button>
      <button class="nav-item" data-view="ddns"><span class="ico">↻</span>DDNS</button>
      <button class="nav-item" data-view="queries"><span class="ico">◷</span>查询日志</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙</span>设置</button>
      <button class="nav-item" data-view="users"><span class="ico">◉</span>用户</button>
    </nav>
    <div class="sidebar-foot">
      <div class="me" id="me"></div>
      <button class="nav-item" id="logout">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">概览</h2>
      <div class="topbar-right">
        <span class="pill" id="health-pill">…</span>
        <button class="btn btn-ghost" id="refresh">刷新</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- ── Modal ─────────────────────────────────────────────────────── -->
<div id="modal" class="modal-backdrop" hidden>
  <div class="modal">
    <header class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" id="modal-close" aria-label="关闭">✕</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast-wrap"></div>

<script src="/app.js"></script>
</body>
</html>
