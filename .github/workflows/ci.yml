name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No install step: the project has zero runtime dependencies.
      - name: Unit and API tests
        run: node test/smoke.js

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Sends real DNS packets over UDP/TCP against a spawned server and
      # verifies state survives a restart.
      - name: End-to-end tests
        run: node test/live.js

      # Mirrors the assertions the docker job makes, so a broken smoke test
      # is caught here even when the image builds fine.
      - name: Verify the smoke-test assertions themselves
        run: node test/ci-smoke-local.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Used only to parse the health JSON; the runner ships a node, but
      # pinning it keeps the assertion independent of runner image changes.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: puffdns:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          set -euo pipefail

          docker run -d --name puffdns-ci \
            -e DNS_PORT=5353 \
            -e WEB_PORT=8080 \
            -e ADMIN_PASSWORD=ci-smoke-test \
            -p 18080:8080 \
            puffdns:ci

          # Always clean the container up, even if an assertion below fails,
          # so a red run never leaks a container into the next attempt.
          trap 'docker rm -f puffdns-ci >/dev/null 2>&1 || true' EXIT

          # Wait for the panel to answer, and fail loudly if it never does.
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/api/health >/tmp/health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server never became ready; container logs:"
            docker logs puffdns-ci
            exit 1
          fi

          echo "health response:"
          cat /tmp/health.json

          # Parse the JSON instead of grepping it. sendJson pretty-prints with
          # newlines and a space after each colon, so a literal '"status":"ok"'
          # match would never fire.
          node -e '
            const body = JSON.parse(require("fs").readFileSync("/tmp/health.json", "utf8"));
            if (body.status !== "ok") {
              console.error("unexpected status:", body.status);
              process.exit(1);
            }
            console.log("health check passed, uptime:", body.uptime);
          '

          # Exercise the panel shell and the DDNS endpoint anonymously.
          curl -fsS --max-time 5 http://127.0.0.1:18080/ | grep -qi "<title>puffdns"
          echo "panel HTML served OK"

          # Protected endpoints must reject anonymous callers.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/api/zones)
          if [ "$code" != "401" ]; then
            echo "expected 401 from /api/zones without a session, got $code"
            exit 1
          fi
          echo "auth guard OK"

          # The image ships its own HEALTHCHECK; let it report at least once.
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' puffdns-ci 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then
              echo "container reports healthy"
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reports unhealthy"
              docker logs puffdns-ci
              exit 1
            fi
            sleep 2
          done
